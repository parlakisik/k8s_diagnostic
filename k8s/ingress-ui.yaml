apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-diagnostic-ui
  namespace: k8s-diagnostic
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: k8s-diagnostic.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k8s-diagnostic-ui
                port:
                  number: 3000

