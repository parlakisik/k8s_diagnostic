apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "multi-domain-sni-policy"
  namespace: "{{NS_NAME}}"
spec:
  description: "Allow TLS connections to multiple specific domains (multi-domain SNI policy)"
  endpointSelector:
    matchLabels:
      app: client
  egress:
  # Allow egress to specific domains via TLS SNI
  - toPorts:
    - ports:
      - port: "443"
        protocol: TCP
      serverNames:
      # Allowed domains - exact matches
      - "{{DNS_SERVER_1}}"     # Primary DNS server
      - "{{DNS_SERVER_2}}"          # Secondary DNS server
      - "{{API_DOMAIN}}"     # Example API
      - "{{K8S_DOCS_DOMAIN}}"       # Kubernetes documentation
      
      # Wildcards are supported for subdomains
      - "{{GITHUB_DOMAIN_WILDCARD}}"        # GitHub and subdomains
      - "{{AWS_DOMAIN_WILDCARD}}"     # AWS services

  # Allow DNS resolution to function properly
  - toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
    toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": "kube-system"
        "k8s:k8s-app": "kube-dns"

  # Allow ICMP for basic connectivity testing
  - icmps:
    - fields:
      - type: 8  # Echo Request (ping)
