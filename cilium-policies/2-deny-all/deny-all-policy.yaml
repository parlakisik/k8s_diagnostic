apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "deny-all-traffic"
spec:
  description: "Deny all traffic between pods in the test namespace"
  endpointSelector: {}  # Apply to ALL pods (empty selector = all pods)
  ingressDeny:
  - fromEndpoints:
    - {}  # Deny from ALL endpoints (empty selector = all endpoints)
  egressDeny:
  - toEndpoints:
    - {}  # Also deny egress to ALL endpoints for comprehensive blocking
