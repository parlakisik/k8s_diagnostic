apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "dns-based-policy"
  namespace: "{{NS_NAME}}"
spec:
  description: "Allow egress traffic from client to internal cluster networks (DNS-style external access pattern)"
  endpointSelector:
    matchLabels:
      app: client
  egress:
  # Allow traffic to the internal cluster CIDR (like other successful L3 tests)
  - toCIDRSet:
    - cidr: "10.0.0.0/16"
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  # Allow traffic directly to the API pod (required for test validation)
  - toEndpoints:
    - matchLabels:
        app: api
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  # Allow ICMP for basic connectivity tests (same as working L3 tests)
  - toEndpoints:
    - matchLabels: {}
    icmps:
    - fields:
      - type: 8  # Echo Request (ping)
