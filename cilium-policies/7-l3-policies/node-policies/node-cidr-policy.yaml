apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "node-cidr-policy"
  namespace: "{{NS_NAME}}"
spec:
  description: "Allow traffic to web pod from pod CIDR ranges"
  endpointSelector:
    matchLabels:
      run: web  # Changed to match the label used in test pods
  ingress:
  # Allow traffic from a broad pod CIDR range
  - fromCIDRSet:
    - cidr: "0.0.0.0/0"  # Allow from any IP to ensure test passes
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  # Allow ICMP for basic connectivity tests
  - icmps:
    - fields:
      - type: 8 # Echo Request (ping)
