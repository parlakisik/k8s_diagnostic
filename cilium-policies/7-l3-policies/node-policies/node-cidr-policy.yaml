apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "node-cidr-policy"
  namespace: "{{NS_NAME}}"
spec:
  description: "Allow traffic to web pod from pod CIDR ranges"
  endpointSelector:
    matchLabels:
      run: web  # Changed to match the label used in test pods
  ingress:
  # Allow traffic from specific node and pod CIDR ranges
  - fromCIDRSet:
    - cidr: "{{POD_CIDR}}"  # Allow from pod network
    - cidr: "{{NODE_CIDR}}"  # Allow from node network
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  # Allow ICMP for basic connectivity tests
  - icmps:
    - fields:
      - type: 8 # Echo Request (ping)
