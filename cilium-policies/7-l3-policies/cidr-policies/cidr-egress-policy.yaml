apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "cidr-egress-policy"
  namespace: "{{NS_NAME}}"
spec:
  description: "Allow egress traffic from client to API pod via specific CIDR"
  endpointSelector:
    matchLabels:
      app: client
  egress:
  # Allow traffic to the target pod's CIDR
  - toCIDRSet:
    - cidr: "10.0.0.0/16"
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  # Allow traffic directly to the API pod
  - toEndpoints:
    - matchLabels:
        app: api
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  # Allow ICMP for basic connectivity tests
  - toEndpoints:
    - matchLabels: {}
    icmps:
    - fields:
      - type: 8  # Echo Request (ping)
