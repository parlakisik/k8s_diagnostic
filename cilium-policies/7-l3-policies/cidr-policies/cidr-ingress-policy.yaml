apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "cidr-ingress-policy"
  namespace: "{{NS_NAME}}"
spec:
  description: "Allow ingress traffic from the same node CIDR"
  endpointSelector:
    matchLabels:
      app: api
  ingress:
  # Allow traffic based on pod identity/labels
  - fromEndpoints:
    - matchLabels:
        app: client
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  # Allow traffic from specific CIDR
  - fromCIDRSet:
    - cidr: "{{POD_CIDR}}"
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  # Allow ICMP for basic connectivity tests
  - icmps:
    - fields:
      - type: 8 # Echo Request (ping)
