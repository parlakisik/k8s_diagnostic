apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "dns-matchname-policy"
spec:
  description: "DNS L7 policy based on Cilium documentation - allowing specific domain names using exact matching"
  endpointSelector:
    matchLabels:
      app: client
  egress:
  # DNS L7 rules - Allow DNS queries to DNS server (from Cilium docs)
  - toEndpoints:
    - matchLabels:
       "k8s:io.kubernetes.pod.namespace": kube-system
       "k8s:k8s-app": kube-dns
    toPorts:
      - ports:
         - port: "53"
           protocol: ANY
        rules:
          dns:
            - matchName: "cilium.io"
            - matchPattern: "*.cilium.io"
            - matchPattern: "*.api.cilium.io"

  # CRITICAL: toFQDNs section (as per Cilium documentation)
  # This allows connections to IPs returned by DNS queries
  - toFQDNs:
      - matchName: "cilium.io"
      - matchName: "sub.cilium.io"
      - matchName: "service1.api.cilium.io"
      - matchPattern: "special*service.api.cilium.io"
    toPorts:
      - ports:
         - port: "80"
           protocol: TCP
