apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "dns-matchpattern-policy"
spec:
  description: "L7 DNS policy allowing domain patterns using wildcard matching"
  endpointSelector:
    matchLabels:
      app: client
  egress:
  # Allow DNS queries to DNS server
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": kube-system
        "k8s:k8s-app": kube-dns
    toPorts:
      - ports:
         - port: "53"
           protocol: ANY
        rules:
          dns:
            # External domain patterns
            - matchPattern: "{{CILIUM_DOMAIN_WILDCARD}}"          # All cilium.io subdomains
            - matchPattern: "{{GITHUB_DOMAIN_WILDCARD}}"         # All github.com subdomains  
            - matchPattern: "{{DOCKER_DOMAIN_WILDCARD}}"          # All docker.io subdomains
            - matchPattern: "{{GOOGLEAPIS_DOMAIN_WILDCARD}}"     # Google APIs
            - matchPattern: "{{AWS_DOMAIN_WILDCARD}}"      # AWS services
            
            # Kubernetes service patterns (standard format)
            - matchPattern: "*.*.svc.{{CLUSTER_DOMAIN}}"    # service.namespace.svc.cluster.local
            - matchPattern: "*.kube-system.svc.{{CLUSTER_DOMAIN}}"  # All kube-system services
            
            # Development and testing patterns
            - matchPattern: "*.local"              # Local development domains
            - matchPattern: "{{TEST_DOMAIN_PATTERN}}"   # Test environments
            - matchPattern: "*-dev.internal"       # Development services
            
            # Monitoring and observability patterns (using dynamic cluster domain)
            - matchPattern: "*.monitoring.svc.{{CLUSTER_DOMAIN}}"
            - matchPattern: "prometheus-*.svc.{{CLUSTER_DOMAIN}}"
            
            # NOTE: Uncomment the next line to allow ALL DNS queries (use with caution)
            # - matchPattern: "*"

  # Allow actual traffic to target pods/services after DNS resolution
  - toEndpoints:
    - matchLabels:
        app: api
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP

  # Allow ICMP (ping) to target pods
  - toEndpoints:
    - matchLabels:
        app: api
    icmps:
    - fields:
      - type: 8  # ICMP Echo Request (ping)
