apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "path-method-policy"
spec:
  description: "L7 HTTP policy demonstrating complex path, method, and host combinations"
  endpointSelector:
    matchLabels:
      app: api
  ingress:
  - fromEndpoints:
    - matchLabels:
        role: frontend
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
      rules:
        http:
        # Public API - GET only, no authentication required
        - method: "GET"
          path: "/api/public/.*"
        
        # Health check endpoints - GET only
        - method: "GET"
          path: "/health$"
        - method: "GET"
          path: "/metrics$"
        
        # User operations - different methods with authentication
        - method: "GET"
          path: "/api/users/[0-9]+$"
          headers:
          - 'Authorization: Bearer .*'
        
        - method: "POST"
          path: "/api/users$"
          headers:
          - 'Authorization: Bearer .*'
          - 'Content-Type: application/json'
        
        - method: "PUT"
          path: "/api/users/[0-9]+$"
          headers:
          - 'Authorization: Bearer .*'
          - 'Content-Type: application/json'
        
        # Multi-tenant API with host-based routing
        - method: "GET"
          path: "/api/tenant/.*"
          host: "tenant-[a-z0-9]+\\.api\\.example\\.com"
          headers:
          - 'Authorization: Bearer .*'
        
        # Admin operations - highest security requirements + specific host
        - method: "DELETE"
          path: "/api/admin/.*"
          host: "admin\\.api\\.example\\.com"
          headers:
          - 'Authorization: Bearer .*'
          - 'X-Admin-Role: admin'
          - 'X-CSRF-Token: .*'
        
        # Version-specific API endpoints by host
        - method: "POST"
          path: "/api/v1/.*"
          host: "v1\\.api\\.example\\.com"
          headers:
          - 'Authorization: Bearer .*'
          - 'Content-Type: application/json'
