apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "basic-http-get-policy"
spec:
  description: "L7 HTTP policy allowing only GET requests to /public endpoint"
  endpointSelector:
    matchLabels:
      app: api
  ingress:
  - fromEndpoints:
    - matchLabels:
        env: prod
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
      rules:
        http:
        # Allow GET requests to the /public path only
        - method: "GET"
          path: "/public$"
        
        # Also allow GET to health check endpoint  
        - method: "GET"
          path: "/health$"
        
        # Allow GET to static assets
        - method: "GET"
          path: "/static/.*"
